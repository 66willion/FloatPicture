apply plugin: 'com.android.application'

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("signing/release-signing.properties")
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}

def resolveSigningValue = { String envName, String propertyName ->
    def envValue = System.getenv(envName)
    return (envValue != null && !envValue.trim().isEmpty()) ? envValue : releaseSigningProperties.getProperty(propertyName)
}

def releaseStoreFilePath = resolveSigningValue("FLOATPICTURE_RELEASE_STORE_FILE", "storeFile")
def releaseStorePassword = resolveSigningValue("FLOATPICTURE_RELEASE_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = resolveSigningValue("FLOATPICTURE_RELEASE_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = resolveSigningValue("FLOATPICTURE_RELEASE_KEY_PASSWORD", "keyPassword")

android {
    namespace = "tool.xfy9326.floatpicture"
    compileSdk = 35

    defaultConfig {
        applicationId "tool.xfy9326.floatpicture"
        minSdk = 21
        targetSdk = 34
        versionCode 58
        versionName "2.2.22"

        resourceConfigurations.add("zh")

        packaging {
            resources.excludes.addAll(
                    new String[]{
                            "META-INF/*.version",
                            "META-INF/CHANGES",
                            "META-INF/README.md",
                            "okhttp3/internal/publicsuffix/NOTICE",
                            "META-INF/DEPENDENCIES",
                            "META-INF/LICENSE",
                            "META-INF/LICENSE.txt",
                            "META-INF/license.txt",
                            "META-INF/NOTICE",
                            "META-INF/NOTICE.txt",
                            "META-INF/notice.txt",
                            "META-INF/ASL2.0",
                            "META-INF/INDEX.LIST"
                    }
            )
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (!releaseStoreFilePath || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword) {
                throw new GradleException("Missing release signing configuration. Check signing/release-signing.properties or FLOATPICTURE_RELEASE_* environment variables.")
            }
            storeFile rootProject.file(releaseStoreFilePath)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig signingConfigs.release

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            packaging {
                resources.excludes.add("DebugProbesKt.bin")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.google.android.material:material:1.12.0'
}
